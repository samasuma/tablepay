<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#19120c" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>Staff board</title>
<link rel="stylesheet" href="/app.css" />
<style>
  .bar { position: sticky; top: 0; z-index: 10; background: var(--bar); color: #fff; }
  .bar .in { max-width: 1400px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .bar h1 { font-size: 18px; }
  .stat { display: flex; flex-direction: column; line-height: 1.15; }
  .stat b { font-size: 17px; }
  .stat span { font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .06em; }
  .bar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.25); }
  .live { width: 9px; height: 9px; border-radius: 50%; background: #35b779; display: inline-block; margin-right: 6px; }
  .live.off { background: #f0675c; }
  .cols { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  .col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 2px 10px; display: flex; align-items: center; gap: 8px; }
  .count { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .tile { padding: 12px 14px; margin-bottom: 10px; }
  .tile .tl { font-size: 20px; font-weight: 800; }
  .tile.flash { animation: flash 1.2s ease 2; }
  @keyframes flash { 50% { background: var(--accent-soft); } }
  .rq { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; font-weight: 700; }
  .rq-ic { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--accent); }
  .rq-ic.bill { background: var(--ok); }
  .rq-ic.water { background: #0e7490; }
  .rq-ic.other { background: #6d28d9; }
  .rq-note { background: var(--field); border-radius: 10px; padding: 8px 10px; font-size: 14px; margin: -2px 0 10px; }
  .req.acknowledged { opacity: .65; }
  .rq-ic.pay { background: var(--ok); }
  .rq-ic.card, .rq-ic.cash { background: #b45309; }
  .late { background: var(--danger-soft); color: var(--danger); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .tile.overdue { border: 1.5px solid var(--danger); }
  .inpos { background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .adj { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; }
  .adj button { border: 0; background: transparent; color: var(--danger); cursor: pointer; font-size: 13px; font-weight: 700; }
  .tab-tile { cursor: pointer; }
  .tab-tile:hover { border-color: var(--accent); }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; background: var(--ok); }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .tbtn { min-height: 78px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 10px 14px; text-align: left; }
  .tbtn b { font-size: 18px; }
  .tbtn small { font-size: 12px; color: var(--muted); }
  .tbtn.busy { border-color: var(--accent); background: var(--accent-soft); }
  .no-cat { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .no-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .no-item .n { flex: 1; min-width: 0; }
  .no-item .n b { display: block; font-size: 15px; }
  .no-item .n span { font-size: 13px; color: var(--muted); }
  .no-item.out { opacity: .45; }
  .no-step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; }
  .no-step button { width: 40px; height: 40px; border: 0; background: transparent; color: var(--accent); display: grid; place-items: center; cursor: pointer; }
  .no-step span { min-width: 22px; text-align: center; font-weight: 800; }
  .no-add { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--accent); display: grid; place-items: center; cursor: pointer; }
  .no-foot { position: sticky; bottom: -20px; background: var(--card); padding: 12px 0 4px; border-top: 1px solid var(--line); margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .login { max-width: 360px; margin: 10vh auto; padding: 24px; text-align: center; }
  .pin { font-size: 28px; letter-spacing: .5em; text-align: center; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .keypad button { min-height: 58px; font-size: 22px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/common.js"></script>
<script>
const { kes, esc, api, toast, sheet, closeSheet, ago, time, beep } = TP;
let board = null, es = null, restaurant = JSON.parse(localStorage.getItem("tp_restaurant") || "null");
const role = () => localStorage.getItem("tp_role");

function loginView() {
  let pin = "";
  const app = document.getElementById("app");
  const draw = () => {
    app.innerHTML = `<div class="card login">
      <h2>Staff sign in</h2><p class="muted">Enter your PIN</p>
      <div class="pin num">${"•".repeat(pin.length) || "&nbsp;"}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"→"].map((k) => `<button class="btn" data-k="${k}">${k}</button>`).join("")}</div>
      <p class="muted small" style="margin-top:16px">Demo: staff 1234 · manager 9999</p></div>`;
    app.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => key(b.dataset.k)));
  };
  const key = async (k) => {
    if (k === "⌫") pin = pin.slice(0, -1);
    else if (k === "→") return submit();
    else if (pin.length < 8) pin += k;
    draw();
  };
  const submit = async () => {
    try {
      const r = await api("/api/staff/login", { method: "POST", body: { pin } });
      localStorage.setItem("tp_staff_token", r.token);
      localStorage.setItem("tp_role", r.role);
      localStorage.setItem("tp_restaurant", JSON.stringify(r.restaurant));
      restaurant = r.restaurant;
      beep(); // unlocks audio on iOS/Android after a user tap
      start();
    } catch (e) { pin = ""; draw(); toast(e.message); }
  };
  document.onkeydown = (e) => { if (/^\d$/.test(e.key)) key(e.key); if (e.key === "Backspace") key("⌫"); if (e.key === "Enter") submit(); };
  draw();
}

async function refresh() {
  try {
    board = await api("/api/staff/board");
    render();
  } catch (e) {
    if (e.status === 401) { localStorage.removeItem("tp_staff_token"); es?.close(); loginView(); }
  }
}

let flashKey = null;
function start() {
  document.onkeydown = null;
  refresh();
  es?.close();
  es = new EventSource(`/api/staff/events?token=${encodeURIComponent(localStorage.getItem("tp_staff_token"))}`);
  es.addEventListener("hello", () => setLive(true));
  es.addEventListener("alert", (ev) => {
    const a = JSON.parse(ev.data);
    beep();
    flashKey = a.table;
    const AL = { waiter: ["bell", `${a.table} is calling a waiter`], bill: ["receipt", `${a.table} wants the bill`], water: ["water", `${a.table} would like water`],
      other: ["message", `${a.table}: ${a.note || "sent a message"}`], order: ["dish", `New order from ${a.table}`],
      pay: ["receipt", `${a.table} is ready to pay. Check the bill`],
      card: ["card", `${a.table}: bring the card machine (${TP.kes(a.amount)})`],
      cash: ["cash", `${a.table} wants to pay ${TP.kes(a.amount)} in cash`] }[a.kind] || ["bell", a.table];
    toast(AL[1], 5000, TP.icon(AL[0], 18));
    if ("vibrate" in navigator) navigator.vibrate([120, 60, 120]);
  });
  es.addEventListener("change", (ev) => {
    const c = JSON.parse(ev.data);
    if (c.reason === "payment_paid") toast(`Payment received on ${c.table}`, 3500, TP.icon("check", 18, 2.6));
    refresh();
  });
  es.onerror = () => setLive(false);
  setInterval(() => { if (board) render(); }, 30000); // keep "x min ago" fresh
}
function setLive(on) { document.getElementById("live")?.classList.toggle("off", !on); }

const PAY_NAME = { mpesa: "M-Pesa", pesapal: "Pesapal", card: "Card machine", cash: "Cash" };
function render() {
  const b = board;
  const st = b.settings || {};
  const app = document.getElementById("app");
  const waiting = b.requests.filter((r) => r.status === "open").length + (b.assists || []).length;
  const notInPos = b.orders.filter((o) => !o.pos_entered_at && o.status === "new").length;
  const REQ_IC = { waiter: "bell", bill: "receipt", water: "water", other: "message", pay: "receipt" };
  const REQ_T = { waiter: "Calling a waiter", bill: "Wants the bill", water: "Would like water", other: "Message", pay: "Ready to pay · check the bill" };
  app.innerHTML = `
  <div class="bar"><div class="in">
    <h1><span class="live" id="live"></span>${esc(restaurant?.name || "Staff board")}</h1>
    <div class="stat"><b class="num">${kes(b.today.sales)}</b><span>Sales today</span></div>
    <div class="stat"><b class="num">${kes(b.today.mpesa)}</b><span>M-Pesa</span></div>
    ${st.payMethods?.pesapal ? `<div class="stat"><b class="num">${kes(b.today.pesapal)}</b><span>Pesapal</span></div>` : ""}
    <div class="stat"><b class="num">${kes(b.today.card)}</b><span>Card machine</span></div>
    <div class="stat"><b class="num">${kes(b.today.cash)}</b><span>Cash</span></div>
    <div class="stat"><b class="num">${kes(b.today.tips)}</b><span>Tips</span></div>
    <div style="margin-left:auto" class="row">
      ${st.ordering !== "off" ? `<button class="btn sm primary" id="newOrder" style="background:var(--accent);border-color:var(--accent);color:#fff">${TP.icon("plus", 16, 2.4)} New order</button>` : ""}
      <a class="btn sm" href="/admin">Menu & settings</a>
      <button class="btn sm" id="logout">Sign out</button>
    </div>
  </div></div>
  <div class="cols">
    <section class="col">
      <h2>Calls ${waiting ? `<span class="count">${waiting}</span>` : ""}</h2>
      ${(b.assists || []).map((p) => `
        <div class="card tile req ${flashKey === p.table_label ? "flash" : ""}">
          <div class="row between"><span class="tl">${esc(p.table_label)}</span><span class="muted small">${ago(p.created_at)}</span></div>
          <div class="rq"><span class="rq-ic ${p.method}">${TP.icon(p.method === "cash" ? "cash" : "card", 18)}</span>
            ${p.method === "card" ? "Bring the card machine" : "Collect cash"} · ${kes(p.amount + p.tip)}</div>
          ${p.payer_label ? `<div class="muted small" style="margin:-4px 0 8px">For ${esc(p.payer_label)}${p.tip ? ` · includes ${kes(p.tip)} tip` : ""}</div>` : ""}
          <div class="row">
            <button class="btn sm ok" data-assist="${p.id}" data-result="paid" data-method="${p.method}">Paid</button>
            <button class="btn sm ghost danger" data-assist="${p.id}" data-result="failed">Didn't happen</button>
          </div>
        </div>`).join("")}
      ${b.requests.length ? b.requests.map((r) => `
        <div class="card tile req req-${r.kind} ${r.status} ${flashKey === r.table_label ? "flash" : ""}">
          <div class="row between"><span class="tl">${esc(r.table_label)}</span><span class="muted small">${ago(r.created_at)}</span></div>
          <div class="rq"><span class="rq-ic ${r.kind}">${TP.icon(REQ_IC[r.kind] || "bell", 18)}</span>
            ${REQ_T[r.kind] || r.kind}${r.kind === "pay" && r.total ? ` · ${kes(r.total)}` : ""}
            ${r.status === "acknowledged" ? '<span class="pill preparing">On the way</span>' : ""}</div>
          ${r.note ? `<div class="rq-note">“${esc(r.note)}”</div>` : ""}
          <div class="row">
            ${r.kind === "pay" ? `<button class="btn sm primary" data-tab="${r.session_id}">Check & confirm</button>`
              : r.status === "open" ? `<button class="btn sm primary" data-ack="${r.id}">I'm going</button>` : ""}
            <button class="btn sm" data-done="${r.id}">${r.kind === "pay" ? "Dismiss" : "Done"}</button>
            ${r.kind === "bill" ? `<button class="btn sm ghost" data-tab="${r.session_id}">Open bill</button>` : ""}
          </div>
        </div>`).join("") : (b.assists || []).length ? "" : `<div class="empty card">No one is calling.</div>`}
    </section>

    <section class="col">
      <h2>${st.posHandoff ? "Orders to enter" : "Kitchen & bar"} ${b.orders.length ? `<span class="count">${st.posHandoff ? notInPos || b.orders.length : b.orders.length}</span>` : ""}</h2>
      ${b.orders.length ? b.orders.map((o) => {
        const late = st.posHandoff && !o.pos_entered_at && o.status === "new" && o.age_min >= (st.posReminderMin || 3);
        return `
        <div class="card tile ${late ? "overdue" : ""} ${flashKey === o.table_label && o.status === "new" ? "flash" : ""}">
          <div class="row between"><span class="tl">${esc(o.table_label)}</span>
            <span class="row"><span class="muted small">${time(o.created_at)}</span>
            ${st.posHandoff ? (o.pos_entered_at ? '<span class="inpos">In POS</span>' : late ? `<span class="late">Not in POS · ${Math.floor(o.age_min)} min</span>` : '<span class="pill new">New</span>')
              : `<span class="pill ${o.status}">${o.status}</span>`}</span></div>
          ${o.guest_name ? `<div class="muted small">${esc(o.guest_name)}${o.placed_by === "staff" ? " · added by staff" : ""}</div>` : ""}
          <ul style="margin:8px 0;padding-left:18px">${o.items.map((i) => `<li><strong>${i.qty}×</strong> ${esc(i.name)}</li>`).join("")}</ul>
          ${o.note ? `<div class="banner warn small" style="padding:6px 10px;margin-bottom:8px">${esc(o.note)}</div>` : ""}
          <div class="row">
            ${st.posHandoff && !o.pos_entered_at ? `<button class="btn sm primary" data-entered="${o.id}">${TP.icon("pos", 16)} Entered in POS</button>`
              : o.status === "new" ? `<button class="btn sm primary" data-order="${o.id}" data-status="preparing">Start</button>` : ""}
            <button class="btn sm ok" data-order="${o.id}" data-status="served">Served</button>
            <button class="btn sm ghost danger" data-order="${o.id}" data-status="cancelled" style="margin-left:auto">Cancel</button>
          </div>
        </div>`;
      }).join("") : `<div class="empty card">No open orders.</div>`}
    </section>

    <section class="col">
      <h2>Open bills ${b.tabs.length ? `<span class="count">${b.tabs.length}</span>` : ""}</h2>
      ${b.tabs.length ? b.tabs.map((t) => `
        <div class="card tile tab-tile" data-tab="${t.id}">
          <div class="row between"><span class="tl">${esc(t.label)}</span>
            ${t.balance === 0 ? '<span class="pill paid">Paid</span>' : t.pending ? '<span class="pill pending">Paying…</span>'
              : t.payRequested ? '<span class="late">Confirm bill</span>' : st.confirmBill && t.confirmed ? '<span class="inpos">Confirmed</span>' : ""}</div>
          <div class="row between small" style="margin-top:4px"><span class="muted">${t.orders} order${t.orders === 1 ? "" : "s"} · opened ${time(t.opened_at)}</span>
            <span class="num"><strong>${kes(t.balance)}</strong> <span class="muted">of ${kes(t.subtotal)}</span></span></div>
          <div class="progress"><i style="width:${t.subtotal ? Math.round((t.paid / t.subtotal) * 100) : 0}%"></i></div>
        </div>`).join("") : `<div class="empty card">No open bills.</div>`}
    </section>
  </div>`;
  flashKey = null;

  app.querySelector("#newOrder")?.addEventListener("click", () => newOrder());
  app.querySelectorAll("[data-entered]").forEach((x) => (x.onclick = (e) => { e.stopPropagation(); act(`/api/staff/orders/${x.dataset.entered}/entered`, {}); }));
  app.querySelectorAll("[data-assist]").forEach((x) => (x.onclick = () => {
    let reference = "";
    if (x.dataset.result === "paid" && x.dataset.method === "card") reference = prompt("Card slip reference (optional)") || "";
    act(`/api/staff/payments/${x.dataset.assist}`, { result: x.dataset.result, reference });
  }));
  app.querySelector("#logout").onclick = () => { localStorage.removeItem("tp_staff_token"); es?.close(); loginView(); };
  app.querySelectorAll("[data-ack]").forEach((x) => (x.onclick = () => act(`/api/staff/requests/${x.dataset.ack}`, { status: "acknowledged" })));
  app.querySelectorAll("[data-done]").forEach((x) => (x.onclick = () => act(`/api/staff/requests/${x.dataset.done}`, { status: "done" })));
  app.querySelectorAll("[data-order]").forEach((x) => (x.onclick = (e) => {
    e.stopPropagation();
    if (x.dataset.status === "cancelled" && !confirm("Cancel this order? It will be removed from the bill.")) return;
    act(`/api/staff/orders/${x.dataset.order}`, { status: x.dataset.status });
  }));
  app.querySelectorAll("[data-tab]").forEach((x) => (x.onclick = () => openTab(Number(x.dataset.tab))));
}

async function act(path, body) {
  try { await api(path, { method: "POST", body }); refresh(); } catch (e) { toast(e.message); }
}

async function openTab(id) {
  const { session: s, bill: b } = await api(`/api/staff/sessions/${id}`);
  const st = board?.settings || {};
  const canConfirm = st.confirmBill && b.balance > 0 && !b.confirmed && b.subtotal > 0;
  const sh = sheet(`
    <div class="row between"><h2>${esc(s.label)} · bill</h2><span class="muted small">opened ${time(s.opened_at)}</span></div>
    <div style="margin-top:10px">${b.lines.map((l) => `<div class="row between" style="padding:5px 0"><span>${l.qty} × ${esc(l.name)}</span><span class="num">${kes(l.total)}</span></div>`).join("")}</div>
    ${b.adjustments.map((a) => `<div class="adj"><span>${esc(a.label)}</span><span class="row" style="gap:10px"><span class="num">${a.amount < 0 ? "− " + kes(-a.amount) : kes(a.amount)}</span>
      ${b.balance > 0 ? `<button data-rmadj="${a.id}" aria-label="Remove ${esc(a.label)}">Remove</button>` : ""}</span></div>`).join("")}
    ${b.balance > 0 ? `<details style="margin-top:6px" ${canConfirm ? "open" : ""}><summary class="muted small" style="cursor:pointer">Add a line to match the POS: service charge, discount or an item rung up at the bar</summary>
      <div class="row" style="margin-top:8px;gap:6px"><input class="field" id="adjLabel" placeholder="e.g. Service charge" style="flex:2;min-height:40px" />
        <input class="field num" id="adjAmt" inputmode="numeric" placeholder="KES, −200 for a discount" style="flex:1;min-height:40px" />
        <button class="btn sm" id="adjAdd">Add</button></div></details>` : ""}
    <div class="row between" style="border-top:1px solid var(--line);padding-top:8px;margin-top:6px;font-weight:700"><span>Total</span><span class="num">${kes(b.subtotal)}</span></div>
    ${st.confirmBill && b.balance > 0 ? (b.confirmed
      ? `<div class="row small" style="margin-top:8px;color:var(--ok);font-weight:700">${TP.icon("check", 16, 2.6)} Confirmed at ${time(b.confirmedAt)}. Guests can split and pay.</div>`
      : `<button class="btn primary lg block" id="confirmBill" style="margin-top:10px">${TP.icon("check", 18, 2.6)} Matches the POS · confirm ${kes(b.subtotal)}</button>
         <p class="muted small" style="margin:6px 0 0">Guests can only pay once you confirm. Any new order re-opens the check.</p>`) : ""}
    ${b.payments.filter((p) => p.status !== "failed").map((p) => `<div class="row between small" style="padding:4px 0">
      <span>${PAY_NAME[p.method] || p.method}${p.payer_label && p.payer_label !== "Recorded by staff" ? ` · ${esc(p.payer_label)}` : ""} ${p.provider_ref ? `<span class="muted">${esc(p.provider_ref)}</span>` : ""} ${p.tip ? `<span class="muted">+ ${kes(p.tip)} tip</span>` : ""}</span>
      <span><span class="pill ${p.status}">${p.status}</span> <span class="num">${kes(p.amount)}</span></span></div>`).join("")}
    <div class="row between" style="font-size:22px;font-weight:800;margin-top:8px"><span>Balance</span><span class="num">${kes(b.balance)}</span></div>
    ${b.balance > 0 ? `<label class="lbl" for="cash">Record cash or card payment</label>
      <div class="row"><input class="field num" id="cash" inputmode="numeric" value="${b.balance}" style="flex:1" />
        <button class="btn" data-m="cash">Cash</button><button class="btn" data-m="card">Card</button></div>` : ""}
    <button class="btn ${b.balance > 0 ? "" : "primary"} lg block" id="close" style="margin-top:16px">
      ${b.balance > 0 ? "Close table anyway" : "Close table & free it up"}</button>
    <div class="row" style="margin-top:8px"><button class="btn block" data-additems style="flex:1">${TP.icon("plus", 16, 2.4)} Add items</button>
      <a class="btn ghost block" style="flex:1" href="/r/${s.receipt_token}" target="_blank">Open receipt</a></div>`);
  sh.querySelector("[data-additems]").onclick = () => newOrder(s.table_id);
  if (st.ordering === "off") sh.querySelector("[data-additems]").remove();
  sh.querySelector("#adjAdd")?.addEventListener("click", async () => {
    try {
      await api(`/api/staff/sessions/${id}/adjustments`, { method: "POST", body: {
        label: sh.querySelector("#adjLabel").value, amount: Number(String(sh.querySelector("#adjAmt").value).replace(/[^\d-]/g, "")) } });
      openTab(id); refresh();
    } catch (e) { toast(e.message); }
  });
  sh.querySelectorAll("[data-rmadj]").forEach((x) => (x.onclick = async () => {
    try { await api(`/api/staff/sessions/${id}/adjustments/${x.dataset.rmadj}`, { method: "DELETE" }); openTab(id); refresh(); }
    catch (e) { toast(e.message); }
  }));
  sh.querySelector("#confirmBill")?.addEventListener("click", async () => {
    try {
      await api(`/api/staff/sessions/${id}/confirm`, { method: "POST", body: { total: b.subtotal } });
      toast(`${s.label}: bill confirmed`, 3000, TP.icon("check", 18, 2.6)); openTab(id); refresh();
    } catch (e) { toast(e.message); openTab(id); }
  });
  sh.querySelectorAll("[data-m]").forEach((x) => (x.onclick = async () => {
    try {
      await api(`/api/staff/sessions/${id}/cash`, { method: "POST", body: { amount: Number(sh.querySelector("#cash").value), method: x.dataset.m } });
      toast("Payment recorded"); openTab(id); refresh();
    } catch (e) { toast(e.message); }
  }));
  sh.querySelector("#close").onclick = async () => {
    const force = b.balance > 0;
    if (force && !confirm(`${kes(b.balance)} is unpaid. Close anyway?`)) return;
    try { await api(`/api/staff/sessions/${id}/close`, { method: "POST", body: { force } }); closeSheet(); toast(`${s.label} closed`); refresh(); }
    catch (e) { toast(e.message); }
  };
}

// ---------- waiter enters an order ----------
async function newOrder(presetTableId) {
  let tables, menu;
  try { [tables, menu] = await Promise.all([api("/api/staff/tables"), api("/api/admin/menu")]); }
  catch (e) { return toast(e.message); }
  const st = { tableId: presetTableId || null, cart: new Map(), q: "" };
  const items = menu.flatMap((c) => c.items);
  const total = () => [...st.cart].reduce((s, [id, q]) => s + (items.find((i) => i.id === id)?.price || 0) * q, 0);
  const count = () => [...st.cart.values()].reduce((a, b) => a + b, 0);
  const label = () => tables.find((t) => t.id === st.tableId)?.label || "";

  const pickTable = () => {
    const sh = sheet(`<div class="row between" style="margin-bottom:14px"><h2>New order · pick a table</h2>
        <button class="btn sm ghost" data-x>${TP.icon("x", 16, 2.4)}</button></div>
      <div class="tgrid">${tables.map((t) => `<button class="tbtn ${t.sessionId ? "busy" : ""}" data-t="${t.id}">
        <b>${esc(t.label)}</b><small>${t.sessionId && t.subtotal ? `Open · ${kes(t.balance)} due` : "No open bill"}</small></button>`).join("")}</div>`);
    sh.querySelector("[data-x]").onclick = closeSheet;
    sh.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { st.tableId = Number(b.dataset.t); pickItems(); }));
  };

  const listHtml = () => {
    const q = st.q.trim().toLowerCase();
    return menu.map((c) => {
      const its = c.items.filter((i) => !q || i.name.toLowerCase().includes(q));
      if (!its.length) return "";
      return `<div class="no-cat">${esc(c.name)}</div>` + its.map((i) => {
        const n = st.cart.get(i.id) || 0;
        return `<div class="no-item ${i.available ? "" : "out"}"><div class="n"><b>${esc(i.name)}</b><span>${i.available ? kes(i.price) : "Sold out"}</span></div>
          ${!i.available ? "" : n ? `<div class="no-step"><button data-d="${i.id}" aria-label="Remove one">${TP.icon("minus", 18, 2.4)}</button><span>${n}</span><button data-i="${i.id}" aria-label="Add one">${TP.icon("plus", 18, 2.4)}</button></div>`
            : `<button class="no-add" data-i="${i.id}" aria-label="Add ${esc(i.name)}">${TP.icon("plus", 18, 2.4)}</button>`}</div>`;
      }).join("");
    }).join("") || `<div class="empty">No items match.</div>`;
  };
  const footHtml = () => `<input class="field" id="noName" maxlength="40" placeholder="Guest name (optional)" value="${esc(st.name || "")}" />
    <input class="field" id="noNote" maxlength="200" placeholder="Note for the kitchen (optional)" value="${esc(st.note || "")}" />
    <button class="btn primary lg block" id="noSend" ${count() ? "" : "disabled"}>${count() ? `Send ${count()} item${count() > 1 ? "s" : ""} to ${esc(label())} · ${kes(total())}` : "Add items to send"}</button>`;

  const pickItems = () => {
    const sh = sheet(`<div class="row between" style="margin-bottom:10px"><div><h2>New order · ${esc(label())}</h2>
        <button class="btn sm ghost" data-change style="padding-left:0">Change table</button></div>
        <button class="btn sm ghost" data-x>${TP.icon("x", 16, 2.4)}</button></div>
      <input class="field" id="noQ" type="search" placeholder="Search the menu" value="${esc(st.q)}" />
      <div id="noList">${listHtml()}</div>
      <div class="no-foot" id="noFoot">${footHtml()}</div>`);
    sh.querySelector("[data-x]").onclick = closeSheet;
    sh.querySelector("[data-change]").onclick = pickTable;
    const refreshParts = () => {
      st.name = sh.querySelector("#noName")?.value; st.note = sh.querySelector("#noNote")?.value;
      sh.querySelector("#noList").innerHTML = listHtml(); sh.querySelector("#noFoot").innerHTML = footHtml(); wire();
    };
    const wire = () => {
      sh.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => { const id = +b.dataset.i; st.cart.set(id, (st.cart.get(id) || 0) + 1); refreshParts(); }));
      sh.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { const id = +b.dataset.d, n = (st.cart.get(id) || 0) - 1; n > 0 ? st.cart.set(id, n) : st.cart.delete(id); refreshParts(); }));
      sh.querySelector("#noSend").onclick = send;
    };
    sh.querySelector("#noQ").oninput = (e) => { st.q = e.target.value; refreshParts(); };
    async function send() {
      const btn = sh.querySelector("#noSend"); btn.disabled = true; btn.textContent = "Sending…";
      try {
        await api(`/api/staff/tables/${st.tableId}/orders`, { method: "POST", body: {
          guestName: sh.querySelector("#noName").value, note: sh.querySelector("#noNote").value,
          items: [...st.cart].map(([id, qty]) => ({ id, qty })) } });
        closeSheet(); toast(`Order sent for ${label()}`, 3000, TP.icon("check", 18, 2.6)); refresh();
      } catch (e) { btn.disabled = false; btn.textContent = "Try again"; toast(e.message); }
    }
    wire();
  };
  st.tableId ? pickItems() : pickTable();
}

localStorage.getItem("tp_staff_token") ? start() : loginView();
</script>
