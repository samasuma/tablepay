<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>Menu</title>
<link rel="stylesheet" href="/app.css" />
<style>
  :root { --ph: #d5dee8; --ph-ink: #7b8896; --tag-ink: #a14a00; --tag-bg: #fdf0e1; --blue-tint: #f3f8ff; }
  @media (prefers-color-scheme: dark) { :root { --ph: #233040; --ph-ink: #6f7d8c; --tag-ink: #f0a868; --tag-bg: #3a2614; --blue-tint: #15233a; } }
  html, body { background: var(--page); }
  body { font-variant-numeric: tabular-nums; }
  .shell { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; }
  .pad-dock { padding-bottom: 110px; }

  /* header */
  .hdr { background: var(--card); padding: 18px 16px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--bar); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .bt { flex: 1; min-width: 0; }
  .rname { font-size: 17px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rsub { font-size: 13px; color: var(--muted); }
  .tchip { background: var(--bar); color: #fff; border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .acts { display: flex; align-items: center; gap: 8px; }
  .hp { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .hp svg { color: var(--accent); }
  .hp .sub { color: var(--muted); font-weight: 600; }
  .hp.called { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .hp.ontheway { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, currentColor 6%, transparent); } }
  .iconbtn { width: 40px; height: 40px; flex: none; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .iconbtn.plain { border: 0; background: transparent; width: 44px; height: 44px; }
  .iconbtn.soft { border: 0; background: var(--field); }
  .acts .iconbtn { margin-left: auto; }
  .searchrow { display: flex; align-items: center; gap: 10px; }
  .searchbox { flex: 1; height: 44px; border-radius: 12px; background: var(--field); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--muted); }
  .searchbox input { border: 0; outline: none; background: transparent; flex: 1; min-width: 0; font-size: 15px; color: var(--ink); }
  .linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 14px; padding: 10px 4px; cursor: pointer; }

  /* status cards */
  .status { margin: 12px 16px 0; background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
  .status-row { display: flex; align-items: center; gap: 12px; }
  .status-ic { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--accent); }
  .status.ack .status-ic { background: var(--ok); }
  .status-t { font-size: 15px; font-weight: 800; }
  .status-s { font-size: 13px; color: var(--muted); }
  .status-note { font-size: 13px; background: var(--field); border-radius: 10px; padding: 8px 10px; }
  .steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .steps3 div { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .steps3 i { height: 4px; border-radius: 2px; background: var(--line); }
  .steps3 .on { color: var(--ink); }
  .steps3 .on i { background: var(--accent); }
  .status.ack .steps3 .on i { background: var(--ok); }
  .btn-sm { height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; }

  /* chips */
  .chips { position: sticky; top: 0; z-index: 15; background: var(--page); display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--bar); border-color: var(--bar); color: #fff; font-weight: 700; }

  /* menu */
  .sec { padding: 6px 16px 10px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 64px; }
  .sec h2 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; margin: 6px 0 2px; }
  .picks { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
  .picks::-webkit-scrollbar { display: none; }
  .pick { width: 172px; flex: none; background: var(--card); border-radius: 18px; overflow: hidden; }
  .pick .photo { width: 100%; height: 112px; border-radius: 0; }
  .pick .ctrl { right: 8px; bottom: 8px; }
  .pick-b { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; font-weight: 700; }
  .pick-b .p { color: var(--muted); }
  .item { background: var(--card); border-radius: 18px; padding: 14px; display: flex; gap: 14px; }
  .item.out { opacity: .55; }
  .item-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .item-n { font-size: 15px; font-weight: 700; }
  .item-d { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .item-p { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 15px; font-weight: 700; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; color: var(--muted); background: var(--field); }
  .tag.spicy { color: var(--tag-ink); background: var(--tag-bg); }
  .tag.chef { color: var(--accent); background: var(--accent-soft); }
  .photo { width: 92px; height: 92px; flex: none; border-radius: 14px; background: var(--ph); color: var(--ph-ink); position: relative; display: grid; place-items: center; }
  .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .ctrl { position: absolute; right: -6px; bottom: -6px; }
  .add { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--card); color: var(--accent); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(17,24,39,.18); cursor: pointer; }
  .stepper-d { height: 36px; border-radius: 999px; background: var(--bar); color: #fff; display: flex; align-items: center; gap: 2px; padding: 0 4px; }
  .stepper-d button { width: 28px; height: 28px; border: 0; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; }
  .stepper-d span { min-width: 16px; text-align: center; font-size: 14px; font-weight: 800; }
  .soldout { font-size: 13px; font-weight: 700; margin-top: 4px; }

  /* dock */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--page); padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); }
  .dock-in { max-width: 488px; margin: 0 auto; display: flex; gap: 10px; }
  .bar { flex: 1; height: 60px; border: 0; border-radius: 18px; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .bar.dark { background: var(--bar); box-shadow: 0 8px 24px rgba(17,24,39,.25); }
  .bar.blue { background: var(--accent); box-shadow: 0 8px 24px rgba(26,115,231,.3); }
  .bar.green { background: var(--ok); justify-content: center; }
  .bar.center { justify-content: center; }
  .bar .amt { margin-left: auto; }
  .badge { width: 28px; height: 28px; border-radius: 999px; background: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  .bar-2 { height: 60px; padding: 0 20px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .bar:disabled { opacity: .5; cursor: not-allowed; }

  /* inner pages */
  .top { position: sticky; top: 0; z-index: 20; background: var(--card); padding: 12px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
  .top .tt { flex: 1; min-width: 0; }
  .top h1 { font-size: 17px; font-weight: 800; }
  .toplink { font-size: 14px; font-weight: 700; padding: 10px 8px; text-decoration: none; }
  .page { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border-radius: 20px; padding: 18px; border: 0; box-shadow: none; }
  .lbl-s { font-size: 13px; font-weight: 600; color: var(--muted); }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
  .payrow { display: flex; align-items: center; gap: 10px; background: var(--ok-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .payrow.pending { background: var(--warn-soft); }
  .tick { width: 24px; height: 24px; flex: none; border-radius: 999px; background: var(--ok); color: #fff; display: grid; place-items: center; }
  .payrow.pending .tick { background: var(--warn); }
  .grp-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; font-size: 14px; font-weight: 800; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
  .line .q { color: var(--muted); }
  .sep { height: 1px; background: var(--line); margin: 6px 0; }
  .status-pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 3px 7px; background: var(--accent-soft); color: var(--accent); }
  .status-pill.preparing { background: var(--warn-soft); color: var(--warn); }
  .status-pill.served { background: var(--ok-soft); color: var(--ok); }
  .status-pill.cancelled { background: var(--danger-soft); color: var(--danger); text-decoration: line-through; }
  .fine { font-size: 12px; color: var(--muted); text-align: center; }
  .warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }

  /* pay */
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  legend, .h3 { font-size: 14px; font-weight: 800; padding: 0; margin-bottom: 10px; }
  .opt { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; min-height: 60px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .opt.on { background: var(--blue-tint); border: 1.5px solid var(--accent); }
  .opt input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex: none; }
  .opt .ot { flex: 1; display: flex; flex-direction: column; font-size: 15px; font-weight: 600; padding: 10px 0; }
  .opt .os { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .opt .oa { font-size: 15px; font-weight: 700; }
  .mini-step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  .mini-step button { width: 30px; height: 28px; border: 0; background: transparent; color: var(--accent); font-weight: 800; font-size: 16px; cursor: pointer; }
  .mini-step b { min-width: 16px; text-align: center; color: var(--ink); }
  .tips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tipb { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; }
  .tipb.on { background: var(--bar); border-color: var(--bar); color: #fff; }
  .field-row { height: 52px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .field-row:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .field-row input { border: 0; outline: none; background: transparent; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; color: var(--ink); }
  .field-row .pre { font-size: 15px; color: var(--muted); font-weight: 600; }
  .field-row .vr { width: 1px; height: 22px; background: var(--line); }
  .summary { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(17,24,39,.08); padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .summary-in { max-width: 488px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .sumline { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .sumtotal { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; padding-top: 4px; }
  .primary { height: 58px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; width: 100%; text-decoration: none; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .secondary { height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .ghost-danger { height: 44px; border: 0; background: transparent; color: var(--danger); font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }

  /* waiting + result */
  .full { min-height: 100vh; background: var(--card); display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
  .full-top { padding: 14px 12px 0; }
  .full-mid { display: flex; flex-direction: column; align-items: center; padding: 10px 28px 0; gap: 22px; text-align: center; }
  .full-bot { margin-top: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; }
  .phone-ill { width: 150px; height: 240px; border-radius: 30px; border: 6px solid var(--bar); background: var(--page); padding: 26px 12px 0; position: relative; }
  .phone-ill::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 6px; margin-left: -20px; border-radius: 3px; background: var(--bar); }
  .prompt { background: #fff; color: #111; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 18px rgba(17,24,39,.18); font-size: 9px; line-height: 1.35; text-align: left; }
  .pins { display: flex; gap: 6px; justify-content: center; }
  .pins i { width: 9px; height: 9px; border-radius: 999px; border: 1.5px solid #9aa6b4; animation: pin 2.4s infinite; }
  .pins i:nth-child(2) { animation-delay: .3s; } .pins i:nth-child(3) { animation-delay: .6s; } .pins i:nth-child(4) { animation-delay: .9s; }
  @keyframes pin { 30%, 70% { background: #19120c; border-color: #19120c; } }
  .prompt .okb { height: 22px; border-radius: 7px; background: var(--accent); }
  .h-big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .lead { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0; }
  .lead strong { color: var(--ink); }
  .wsteps { list-style: none; margin: 0; padding: 16px; width: 100%; background: var(--field); border-radius: 18px; display: flex; flex-direction: column; gap: 14px; text-align: left; }
  .wsteps li { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; }
  .wsteps .todo { color: var(--muted); }
  .ring { width: 26px; height: 26px; flex: none; border-radius: 999px; border: 3px solid var(--accent); border-right-color: var(--line); animation: spin 1s linear infinite; }
  .circle { width: 26px; height: 26px; flex: none; border-radius: 999px; border: 2px solid var(--line); }
  .wsteps .tick { width: 26px; height: 26px; }
  .big-tick { width: 72px; height: 72px; border-radius: 999px; background: var(--ok); color: #fff; display: grid; place-items: center; }
  .big-alert { width: 72px; height: 72px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; }
  .refbox { width: 100%; background: var(--field); border-radius: 16px; padding: 4px 16px; }
  .refbox .line { padding: 10px 0; }
  .refbox .line + .line { border-top: 1px solid var(--line); }

  /* sheets */
  .sheet h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .sheet-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .sheet-h > div { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { min-height: 112px; border-radius: 18px; border: 1px solid var(--line); background: var(--field); padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; color: var(--ink); cursor: pointer; }
  .tile .ti { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .tile.primary-t { border: 1.5px solid var(--accent); background: var(--blue-tint); }
  .tile.primary-t .ti { background: var(--accent); color: #fff; }
  .tile.sent { border-color: var(--ok); background: var(--ok-soft); }
  .tile.sent .ti { background: var(--ok); color: #fff; }
  .tile b { font-size: 15px; display: block; }
  .tile small { font-size: 12px; color: var(--muted); }
  .rowlink { display: flex; align-items: center; gap: 14px; padding: 4px 0; border: 0; background: transparent; text-align: left; color: var(--ink); width: 100%; cursor: pointer; }
  .rowlink .ri { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
  .rowlink b { font-size: 15px; display: block; }
  .rowlink small { font-size: 13px; color: var(--muted); }
  .cart-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cart-line .n { font-weight: 700; }
  .stepper-l { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; }
  .stepper-l button { width: 40px; height: 40px; border: 0; background: transparent; color: var(--accent); display: grid; place-items: center; cursor: pointer; }
  .stepper-l span { min-width: 22px; text-align: center; font-weight: 800; }
  textarea.field { min-height: 88px; resize: vertical; }

  .closed { text-align: center; padding: 80px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .empty-card { text-align: center; padding: 32px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); }
  .empty-card .ei { width: 56px; height: 56px; border-radius: 18px; background: var(--field); display: grid; place-items: center; }
  body.has-summary .toast { bottom: 250px; }
  @media (min-width: 560px) { .shell { box-shadow: 0 0 0 1px var(--line); } }
</style>
</head>
<body>
<div id="app"><div style="padding-top:120px"><div class="spinner"></div></div></div>

<script src="/common.js"></script>
<script>
const { kes, esc, api, toast, sheet, closeSheet, ago, time, icon } = TP;
const code = location.pathname.split("/").pop();
const LS = { name: "tp_guest_name", phone: "tp_guest_phone" };

const state = {
  data: null, bill: null, requests: [],
  cart: new Map(),
  view: "menu",          // menu | bill | pay | wait | result | closed
  searching: false, q: "",
  pay: { mode: "all", people: 2, tip: 0, tipCustom: "", custom: "" },
  payment: null,         // { id, total, phone, started }
  result: null,
  receiptToken: null,
};

// ---------- helpers ----------
const allItems = () => state.data.menu.flatMap((c) => c.items);
const itemById = (id) => allItems().find((i) => i.id === id);
const cartCount = () => [...state.cart.values()].reduce((a, b) => a + b, 0);
const cartTotal = () => [...state.cart].reduce((s, [id, q]) => s + (itemById(id)?.price || 0) * q, 0);
const tableName = () => {
  const l = state.data.table.label;
  return /^T\d+$/i.test(l) ? "Table " + l.slice(1) : l;
};
const mineKey = () => `tp_mine_${state.data.session.id}`;
const mine = () => { try { return JSON.parse(localStorage.getItem(mineKey()) || "[]"); } catch { return []; } };
const addMine = (orderId) => { try { localStorage.setItem(mineKey(), JSON.stringify([...mine(), orderId])); } catch {} };
const myTotal = () => {
  const ids = mine();
  return state.bill.orders.filter((o) => ids.includes(o.id) && o.status !== "cancelled")
    .reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty * i.unit_price, 0), 0);
};
const available = () => Math.max(0, state.bill.balance - state.bill.pending);
const okIcon = icon("check", 18, 2.6);
const errIcon = icon("alert", 18, 2.2);

function setView(v) { state.view = v; render(); window.scrollTo(0, 0); }

// ---------- data ----------
async function load() {
  try {
    const d = await api(`/api/t/${code}`);
    state.data = d;
    state.bill = d.bill;
    state.receiptToken = d.session.receipt_token;
    document.title = `${d.restaurant.name} · ${tableName()}`;
    state.requests = await api(`/api/t/${code}/requests`);
    render();
    listen();
    window.addEventListener("scroll", spy, { passive: true });
    setInterval(() => { if (state.view === "menu" && state.requests.length) renderStatusOnly(); }, 30000);
  } catch {
    document.getElementById("app").innerHTML = `<div class="closed"><div class="big-alert">${icon("alert", 34)}</div>
      <h2>Table not found</h2><p class="lead">This code may have been replaced. Please ask a staff member for help.</p></div>`;
  }
}

async function refreshRequests() {
  try { state.requests = await api(`/api/t/${code}/requests`); } catch {}
  if (state.view === "menu") render();
}

function listen() {
  const es = new EventSource(`/api/t/${code}/events`);
  es.addEventListener("bill", (ev) => {
    const d = JSON.parse(ev.data);
    state.bill = d.bill;
    if (d.status === "closed") {
      state.receiptToken = d.receipt_token;
      es.close(); closeSheet();
      return setView("closed");
    }
    if (d.reason === "request_acknowledged") toast("The team has seen your request", 3500, icon("bell", 18));
    if (d.reason === "order_preparing") toast("Your order is being prepared", 3000, okIcon);
    if (d.reason === "order_served") toast("Order served. Enjoy!", 3000, okIcon);
    if (d.reason.startsWith("request")) return refreshRequests();
    window.dispatchEvent(new CustomEvent("tp-bill", { detail: d }));
    if (["menu", "bill"].includes(state.view)) render();
  });
}

// ---------- render ----------
function render() {
  const app = document.getElementById("app");
  const v = state.view;
  app.innerHTML = v === "menu" ? menuView() : v === "bill" ? billView() : v === "pay" ? payView()
    : v === "wait" ? waitView() : v === "result" ? resultView() : closedView();
  bind(app);
  document.body.classList.toggle("has-summary", v === "pay");
  if (v === "menu") spy();
}

function renderStatusOnly() {
  const box = document.getElementById("statusBox");
  if (box) { box.innerHTML = statusCards(); bindStatus(box); }
}

// ----- menu -----
function servicePill() {
  const open = state.requests;
  if (open.some((r) => r.status === "acknowledged")) return `<button class="hp ontheway" data-act="service"><span class="dot"></span>On the way</button>`;
  if (open.length) return `<button class="hp called" data-act="service"><span class="dot"></span>Called</button>`;
  return `<button class="hp" data-act="service">${icon("bell", 18)}Service</button>`;
}

const REQ = {
  waiter: { ic: "bell", open: "Waiter called", ack: "A waiter is on the way" },
  bill: { ic: "receipt", open: "Bill requested", ack: "Your bill is on the way" },
  water: { ic: "water", open: "Water requested", ack: "Water is on the way" },
  other: { ic: "message", open: "Message sent", ack: "The team has seen your message" },
};
function statusCards() {
  return state.requests.map((r) => {
    const m = REQ[r.kind] || REQ.waiter;
    const ack = r.status === "acknowledged";
    return `<div class="status ${ack ? "ack" : ""}" role="status">
      <div class="status-row">
        <span class="status-ic">${icon(m.ic, 22)}</span>
        <div style="flex:1;min-width:0"><div class="status-t">${ack ? m.ack : m.open}</div>
          <div class="status-s">${ack ? `Seen by the team ${ago(r.acknowledged_at)}` : `Sent ${ago(r.created_at)} · waiting for the team`}</div></div>

    </div>`;
  }).join("");
}

const ART_RULES = [
  [/burger/i, "burger"], [/curry|stew/i, "curry"], [/pilau|rice|biryani/i, "rice"], [/samosa|bhajia|mandazi/i, "samosa"],
  [/wrap|roll/i, "wrap"], [/chips|fries/i, "fries"], [/fish|tilapia|samaki/i, "fish"], [/wing|chicken|kuku/i, "chicken"],
  [/choma|rib|steak|beef|goat|lamb|pork|sausage|meat|mishkaki/i, "grill"], [/sukuma|salad|kale|greens|veg/i, "greens"],
  [/ugali|chapati|bread|naan/i, "staple"], [/tusker|beer|lager|cider|pilsner/i, "beer"], [/soda|coke|fanta|sprite|stoney/i, "soda"],
  [/juice|smoothie|passion|mango|shake/i, "juice"], [/tea|coffee|chai|latte/i, "tea"], [/water/i, "water"],
  [/dawa|cocktail|mojito|wine|gin|whisky|vodka/i, "cocktail"],
];
const CAT_RULES = [[/drink|bar|beverage/i, "soda"], [/side/i, "staple"], [/starter|snack/i, "samosa"], [/grill/i, "grill"]];
function artFor(i) {
  const hit = ART_RULES.find(([re]) => re.test(i.name));
  if (hit) return hit[1];
  const cat = state.data.menu.find((c) => c.id === i.category_id)?.name || "";
  return (CAT_RULES.find(([re]) => re.test(cat)) || [0, "default"])[1];
}
function photo(i, extra = "") {

function ctrl(i) {

// keep the category chip in sync with scrolling
function spy() {
  if (state.view !== "menu" || state.searching) return;
  const secs = [...document.querySelectorAll("[data-sec]")];
  if (!secs.length) return;
  let cur = secs[0].dataset.sec;
  for (const s of secs) if (s.getBoundingClientRect().top <= innerHeight * 0.35) cur = s.dataset.sec;
  document.querySelectorAll(".chip").forEach((c) => {
    const on = c.dataset.cat === String(cur);
    if (on && !c.classList.contains("on")) c.scrollIntoView({ inline: "nearest", block: "nearest" });
    c.classList.toggle("on", on);
  });
}

// ----- pay -----
function payAmount() {
  const p = state.pay, b = state.bill, av = available();
  if (p.mode === "split") return Math.min(av, Math.ceil(b.balance / p.people));
  if (p.mode === "mine") return Math.min(av, myTotal());
  if (p.mode === "custom") return Math.min(av, Math.max(0, Math.floor(Number(p.custom) || 0)));
  return av;
}
function payTip() {
  const p = state.pay;
  return p.tip === -1 ? Math.max(0, Math.floor(Number(p.tipCustom) || 0)) : Math.round((payAmount() * p.tip) / 100);
}
function summaryHtml() {
  const a = payAmount(), t = payTip();
  return `<div class="sumline"><span>Towards the bill</span><span>${kes(a)}</span></div>
    ${t ? `<div class="sumline"><span>Tip${state.pay.tip > 0 ? ` (${state.pay.tip}%)` : ""}</span><span>${kes(t)}</span></div>` : ""}
    <div class="sumtotal"><span>You pay</span><span>${kes(a + t)}</span></div>`;
}

async function submitPay() {
  const btn = document.getElementById("go");
  const raw = document.getElementById("phone").value.replace(/\D/g, "");
  const phone = raw.length === 9 ? "0" + raw : raw;
  const amount = payAmount(), tip = payTip();
  btn.disabled = true; btn.innerHTML = `<span class="spinner" style="width:22px;height:22px;border-width:3px;margin:0"></span>Sending prompt…`;
  try {
    const r = await api(`/api/t/${code}/pay`, { method: "POST", body: { phone, amount, tip, payerLabel: localStorage.getItem(LS.name) || "" } });
    localStorage.setItem(LS.phone, phone);
    state.payment = { id: r.paymentId, total: amount + tip, phone, started: Date.now() };
    setView("wait");
    watchPayment();
  } catch (e) {
    btn.disabled = false; btn.innerHTML = `${icon("phone", 20)}Send M‑Pesa prompt`;
    toast(e.message, 4500, errIcon);
  }
}

let watchTimer, tickTimer;
function stopWatching() { clearInterval(watchTimer); clearInterval(tickTimer); window.removeEventListener("tp-bill", onBillDuringWait); }
function onBillDuringWait(e) { if (e.detail.reason.startsWith("payment_")) checkPayment(); }
function watchPayment() {
  stopWatching();
  const tick = () => {
    const el = document.getElementById("wtimer");
    if (!el) return;
    const s = Math.floor((Date.now() - state.payment.started) / 1000);
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };
  tickTimer = setInterval(tick, 1000);
  watchTimer = setInterval(checkPayment, 3000);
  window.addEventListener("tp-bill", onBillDuringWait);
}
async function checkPayment() {
  if (!state.payment) return;
  try {
    const p = await api(`/api/t/${code}/payments/${state.payment.id}`);
    if (p.status === "pending") return;
    stopWatching();
    try { state.bill = (await api(`/api/t/${code}/bill`)).bill; } catch {}
    state.result = p;
    if (state.view === "wait") setView("result");
    else toast(p.status === "paid" ? `Payment of ${kes(p.amount + p.tip)} received` : "Your M‑Pesa payment didn't go through", 4000, p.status === "paid" ? okIcon : errIcon);
  } catch {}
}

// ----- result -----
function resultView() {
  const r = state.result;
  if (r.status === "paid") {
    return `<div class="full">
      <div class="full-mid" style="padding-top:70px">
        <div class="big-tick">${icon("check", 38, 2.6)}</div>
        <div style="display:flex;flex-direction:column;gap:8px"><h1 class="h-big">Payment received</h1>
          <p class="lead">${state.bill.balance > 0 ? `Thanks! <strong>${kes(state.bill.balance)}</strong> is still left on the table's bill.` : "The bill is fully paid. Thank you!"}</p></div>
        <div class="refbox">
          <div class="line"><span class="rsub">Amount</span><strong>${kes(r.amount + r.tip)}</strong></div>
          ${r.tip ? `<div class="line"><span class="rsub">Includes tip</span><span>${kes(r.tip)}</span></div>` : ""}
          <div class="line"><span class="rsub">M‑Pesa reference</span><strong style="font-family:var(--mono)">${esc(r.provider_ref || "—")}</strong></div>
        </div>
      </div>
      <div class="full-bot">
        <a class="primary" href="/r/${state.receiptToken}">${icon("receipt", 20)}View receipt</a>
        <button class="secondary" style="margin-top:6px" data-go="menu">Back to menu</button>
      </div></div>`;
  }
  return `<div class="full">
    <div class="full-mid" style="padding-top:70px">
      <div class="big-alert">${icon("alert", 36)}</div>
      <div style="display:flex;flex-direction:column;gap:8px"><h1 class="h-big">Payment not completed</h1>
        <p class="lead">${esc(r.failure_reason || "The request was cancelled or timed out.")}<br>No money has left your account.</p></div>
    </div>
    <div class="full-bot">
      <button class="primary" data-go="pay">Try again</button>
      <button class="secondary" style="margin-top:6px" data-go="bill">Back to the bill</button>
    </div></div>`;
}

function closedView() {
  return `<div class="shell"><div class="closed">
    <div class="big-tick">${icon("check", 38, 2.6)}</div>
    <h1 class="h-big">Thanks for visiting ${esc(state.data.restaurant.name)}</h1>
    <p class="lead">This table's bill has been closed.</p>
    <a class="primary" style="max-width:280px" href="/r/${state.receiptToken}">${icon("receipt", 20)}View receipt</a>
  </div></div>`;
}

// ---------- events ----------
function bind(app) {
  app.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => {
    const to = b.dataset.go;
    if (to === "pay") state.pay.mode = "all";
    stopWatching();
    setView(to);
  }));
  app.querySelectorAll("[data-pay]").forEach((b) => (b.onclick = () => { state.pay.mode = b.dataset.pay; setView("pay"); }));
  app.querySelectorAll("[data-inc]").forEach((b) => (b.onclick = () => { const id = +b.dataset.inc; state.cart.set(id, (state.cart.get(id) || 0) + 1); render(); }));
  app.querySelectorAll("[data-dec]").forEach((b) => (b.onclick = () => {
    const id = +b.dataset.dec, q = (state.cart.get(id) || 0) - 1;
    q > 0 ? state.cart.set(id, q) : state.cart.delete(id); render();
  }));
  app.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => {
    const el = document.getElementById("sec-" + b.dataset.cat);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 62, behavior: "smooth" });
  }));
  const act = (name, fn) => app.querySelectorAll(`[data-act="${name}"]`).forEach((b) => (b.onclick = fn));
  act("service", openService);
  act("cart", openCart);
  act("search", () => { state.searching = true; render(); document.getElementById("q")?.focus(); });
  act("search-close", () => { state.searching = false; state.q = ""; render(); });
  act("wait-close", () => {
    stopWatching(); setView("bill");
    toast("If you already entered your PIN, the payment will still show on the bill.", 4500);
  });
  act("no-prompt", () => openNoPrompt());
  const q = app.querySelector("#q");
  if (q) q.oninput = () => {
    state.q = q.value; const pos = q.selectionStart;
    render(); const nq = document.getElementById("q"); nq.focus(); nq.setSelectionRange(pos, pos);
  };
  bindStatus(app);

  // pay page
  app.querySelectorAll('input[name="amount"]').forEach((r) => (r.onchange = () => {
    state.pay.mode = r.value; render();
    if (r.value === "custom") document.getElementById("customAmt")?.focus();
  }));
  app.querySelectorAll("[data-people]").forEach((b) => (b.onclick = (e) => {
    e.preventDefault();
    state.pay.mode = "split";
    state.pay.people = Math.max(2, Math.min(20, state.pay.people + Number(b.dataset.people)));
    render();
  }));
  app.querySelectorAll("[data-tip]").forEach((b) => (b.onclick = () => {
    state.pay.tip = Number(b.dataset.tip); render();
    if (state.pay.tip === -1) document.getElementById("tipc")?.focus();
  }));
  const ph = app.querySelector("#phone");
  if (ph) ph.oninput = () => { state.pay.phone = ph.value; };
  const ca = app.querySelector("#customAmt");
  if (ca) {
    ca.oninput = () => {
      state.pay.custom = ca.value.replace(/\D/g, "");
      if (Number(state.pay.custom) > available()) { state.pay.custom = String(available()); ca.value = state.pay.custom; }
      document.getElementById("sumbox").innerHTML = summaryHtml();
      document.getElementById("go").disabled = payAmount() < 1;
    };
  }
  const tipc = app.querySelector("#tipc");
  if (tipc) tipc.oninput = () => { state.pay.tipCustom = tipc.value.replace(/\D/g, ""); document.getElementById("sumbox").innerHTML = summaryHtml(); };
  app.querySelector("#go")?.addEventListener("click", submitPay);
}

function bindStatus(root) {
  root.querySelectorAll("[data-cancel]").forEach((b) => (b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/t/${code}/requests/${b.dataset.cancel}/cancel`, { method: "POST" }); toast("Request cancelled", 2500); }
    catch (e) { toast(e.message, 3500, errIcon); }
    refreshRequests();
  }));
}

// ---------- sheets ----------
function openService() {
  const sent = (k) => state.requests.some((r) => r.kind === k);
  const tile = (kind, ic, title, sub, primary) => `<button class="tile ${sent(kind) ? "sent" : primary ? "primary-t" : ""}" data-kind="${kind}">
      <span class="ti">${icon(sent(kind) ? "check" : ic, 20, sent(kind) ? 2.6 : 2)}</span>
      <span><b>${title}</b><small>${sent(kind) ? "Sent · tap to remind" : sub}</small></span></button>`;
  const sh = sheet(`
    <div class="sheet-h"><div><h2>How can we help?</h2><span class="rsub" style="font-size:14px">${esc(tableName())} · the team is alerted at the bar right away</span></div>
      <button class="iconbtn soft" data-close aria-label="Close">${icon("x", 18, 2.2)}</button></div>
    <div class="tiles">
      ${tile("waiter", "bell", "Call a waiter", "Someone comes to your table", true)}
      ${tile("bill", "receipt", "Bring the bill", "Paper bill or card machine")}
      ${tile("water", "water", "Water or ice", "Bottled, tap or a jug of ice")}
      ${tile("other", "message", "Something else", "Write a short note")}
    </div>
    ${state.bill.balance > 0 ? `<div class="sep" style="margin:18px 0 14px"></div>
    <button class="rowlink" data-paynow><span class="ri">${icon("phone", 20)}</span>
      <span style="flex:1"><b>Skip the wait, pay on your phone</b><small>M‑Pesa · split with your table</small></span>${icon("chevron", 20)}</button>` : ""}`);
  sh.querySelector("[data-close]").onclick = closeSheet;
  sh.querySelector("[data-paynow]")?.addEventListener("click", () => { closeSheet(); setView("bill"); });
  sh.querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => b.dataset.kind === "other" ? openNote() : sendRequest(b.dataset.kind)));
}

function openNote() {
  const sh = sheet(`
    <div class="sheet-h"><div><h2>Message the team</h2><span class="rsub" style="font-size:14px">${esc(tableName())} · keep it short</span></div>
      <button class="iconbtn soft" data-close aria-label="Close">${icon("x", 18, 2.2)}</button></div>
    <label class="lbl" for="note" style="margin-top:0">What do you need?</label>
    <textarea class="field" id="note" maxlength="140" placeholder="e.g. Extra napkins, please. Or: could we move to a bigger table?"></textarea>
    <button class="primary" id="sendNote" style="margin-top:14px">Send to the team</button>`);
  sh.querySelector("[data-close]").onclick = closeSheet;
  const ta = sh.querySelector("#note"); ta.focus();
  sh.querySelector("#sendNote").onclick = () => {
    if (!ta.value.trim()) { ta.focus(); return toast("Write a short note first", 2500); }
    sendRequest("other", ta.value.trim());
  };
}

async function sendRequest(kind, note) {
  try {
    const r = await api(`/api/t/${code}/requests`, { method: "POST", body: { kind, note } });
    closeSheet();
    toast(r.alreadyRequested ? "Already sent. We've reminded the team." : { waiter: "Waiter called", bill: "Bill requested", water: "Water requested", other: "Message sent" }[kind] + ". The team has been alerted.", 3200, okIcon);
    if (state.view !== "menu") setView("menu");
    refreshRequests();
  } catch (e) { toast(e.message, 3500, errIcon); }
}

function openNoPrompt() {
  const sh = sheet(`
    <div class="sheet-h"><div><h2>No prompt yet?</h2></div><button class="iconbtn soft" data-close aria-label="Close">${icon("x", 18, 2.2)}</button></div>
    <ul style="margin:0 0 18px;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45">
      <li>Check the number is right: <strong>${esc(prettyPhone(state.payment.phone))}</strong></li>
      <li>Make sure your phone is unlocked and has signal.</li>
      <li>Prompts expire after about a minute. After that you can send a new one.</li>
    </ul>
    <button class="secondary" data-close>Keep waiting</button>`);
  sh.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeSheet));
}

function openCart() {
  const lines = [...state.cart].map(([id, q]) => ({ item: itemById(id), q })).filter((l) => l.item);
  const sh = sheet(`
    <div class="sheet-h"><div><h2>Your order</h2><span class="rsub" style="font-size:14px">${esc(tableName())} · goes straight to the kitchen</span></div>
      <button class="iconbtn soft" data-close aria-label="Close">${icon("x", 18, 2.2)}</button></div>
    <div>${lines.map(({ item, q }) => `<div class="cart-line">
        <div><div class="n">${esc(item.name)}</div><div class="rsub">${kes(item.price * q)}</div></div>
        <div class="stepper-l"><button data-cdec="${item.id}" aria-label="Remove one ${esc(item.name)}">${icon("minus", 18, 2.4)}</button><span>${q}</span><button data-cinc="${item.id}" aria-label="Add one ${esc(item.name)}">${icon("plus", 18, 2.4)}</button></div>
      </div>`).join("")}</div>
    <label class="lbl" for="gname">Your name</label>
    <input class="field" id="gname" maxlength="40" placeholder="So the table knows whose order it is" value="${esc(localStorage.getItem(LS.name) || "")}" />
    <label class="lbl" for="gnote">Notes for the kitchen</label>
    <input class="field" id="gnote" maxlength="200" placeholder="e.g. No onions, meat well done" />
    <button class="primary" id="placeOrder" style="margin-top:18px"><span>Send order</span><span style="opacity:.75">·</span><span>${kes(cartTotal())}</span></button>
    <p class="fine" style="margin:10px 0 0">You pay at the end, from your phone or with the waiter.</p>`);
  sh.querySelector("[data-close]").onclick = closeSheet;
  sh.querySelectorAll("[data-cinc],[data-cdec]").forEach((b) => (b.onclick = () => {
    const id = Number(b.dataset.cinc || b.dataset.cdec);
    const q = (state.cart.get(id) || 0) + (b.dataset.cinc ? 1 : -1);
    q > 0 ? state.cart.set(id, q) : state.cart.delete(id);
    render();
    cartCount() ? openCart() : closeSheet();
  }));
  sh.querySelector("#placeOrder").onclick = async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true; btn.textContent = "Sending…";
    const guestName = sh.querySelector("#gname").value.trim();
    if (guestName) localStorage.setItem(LS.name, guestName);
    try {
      const r = await api(`/api/t/${code}/orders`, { method: "POST", body: {
        guestName, note: sh.querySelector("#gnote").value, items: [...state.cart].map(([id, qty]) => ({ id, qty })),
      }});
      addMine(r.orderId);
      state.cart.clear();
      closeSheet();
      try { state.bill = (await api(`/api/t/${code}/bill`)).bill; } catch {}
      render();
      toast("Order sent to the kitchen", 3000, okIcon);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Try again";
      toast(e.message, 4000, errIcon);
      if (e.status === 409) { const d = await api(`/api/t/${code}`); state.data.menu = d.menu; render(); }
    }
  };
}

load();
</script>
</body>
</html>
