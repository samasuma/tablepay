<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#19120c" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>Menu</title>
<link rel="stylesheet" href="/app.css" />
<style>
  body { padding-bottom: 150px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
  .brand h1 { font-size: 20px; letter-spacing: -.01em; }
  .tbl { background: var(--bar); color: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .views { margin-top: 12px; }
  .cats { margin-top: 10px; }
  .cat-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; margin: 22px 0 8px; scroll-margin-top: 200px; }
  .item { display: flex; gap: 12px; padding: 14px; align-items: flex-start; }
  .item + .item { border-top: 1px solid var(--line); }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; }
  .item .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .item .price { font-weight: 700; margin-top: 6px; }
  .item.out { opacity: .5; }
  .tag { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
  .add { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 800; cursor: pointer; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .dock .inner { max-width: 640px; margin: 0 auto; }
  .dock .two { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
  .cartbar { margin-bottom: 10px; }

  .bill-line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .total-row { display: flex; justify-content: space-between; padding: 8px 0; font-weight: 700; }
  .balance { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .order-card { padding: 12px 14px; }
  .order-card + .order-card { margin-top: 10px; }
  .banner { border-radius: var(--radius); padding: 12px 14px; font-weight: 600; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .tipchips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tipchips .chip { text-align: center; }
  .paybox { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
  .bigtick { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 34px; margin: 6px auto 10px; }
  .closed { text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<div id="app"><div class="wrap" style="padding-top:80px"><div class="spinner"></div></div></div>

<script src="/common.js"></script>
<script>
const { kes, esc, api, toast, sheet, closeSheet, time } = TP;
const code = location.pathname.split("/").pop();
const LS = { name: "tp_guest_name", phone: "tp_guest_phone" };

const state = {
  data: null,          // restaurant, table, session, menu
  bill: null,
  cart: new Map(),     // itemId -> qty
  view: "menu",
  cat: null,
  closed: false,
  receiptToken: null,
  requests: [],
};

const itemById = (id) => {
  for (const c of state.data.menu) for (const i of c.items) if (i.id === id) return i;
};
const cartCount = () => [...state.cart.values()].reduce((a, b) => a + b, 0);
const cartTotal = () => [...state.cart].reduce((s, [id, q]) => s + itemById(id).price * q, 0);

async function load() {
  try {
    const d = await api(`/api/t/${code}`);
    state.data = d;
    state.bill = d.bill;
    state.receiptToken = d.session.receipt_token;
    state.cat = d.menu[0]?.id;
    document.title = `${d.restaurant.name} · ${d.table.label}`;
    state.requests = await api(`/api/t/${code}/requests`);
    render();
    listen();
  } catch (e) {
    document.getElementById("app").innerHTML =
      `<div class="closed"><h2>Table not found</h2><p class="muted">This code may have been replaced. Please ask a staff member for help.</p></div>`;
  }
}

function listen() {
  const es = new EventSource(`/api/t/${code}/events`);
  es.addEventListener("bill", (ev) => {
    const d = JSON.parse(ev.data);
    const prevReq = state.requests;
    state.bill = d.bill;
    if (d.status === "closed") { state.closed = true; state.receiptToken = d.receipt_token; es.close(); closeSheet(); }
    if (d.reason === "request_acknowledged") toast("A staff member is on the way 👋", 3500);
    if (d.reason === "order_preparing") toast("Your order is being prepared 🍳");
    if (d.reason === "order_served") toast("Order served. Enjoy!");
    if (d.reason.startsWith("request")) api(`/api/t/${code}/requests`).then((r) => { state.requests = r; render(); });
    window.dispatchEvent(new CustomEvent("tp-bill", { detail: d }));
    render();
  });
  es.onerror = () => {}; // EventSource retries on its own
}

// ---------- rendering ----------
function render() {
  const { data, bill } = state;
  const app = document.getElementById("app");
  if (state.closed) {
    app.innerHTML = `<div class="closed wrap">
      <div class="bigtick">✓</div>
      <h2>Thank you for visiting ${esc(data.restaurant.name)}</h2>
      <p class="muted">This table's bill has been closed.</p>
      <a class="btn primary lg" href="/r/${state.receiptToken}">View receipt</a>
    </div>`;
    return;
  }

  const waiterOpen = state.requests.some((r) => r.kind === "waiter");
  app.innerHTML = `
  <header class="top"><div class="wrap">
    <div class="row between">
      <div class="brand"><h1>${esc(data.restaurant.name)}</h1>
        <div class="muted small">${esc(data.restaurant.branch || data.restaurant.tagline || "")}</div></div>
      <span class="tbl">Table ${esc(data.table.label.replace(/^T/, ""))}</span>
    </div>
    <div class="seg views">
      <button data-view="menu" class="${state.view === "menu" ? "on" : ""}">Menu</button>
      <button data-view="tab" class="${state.view === "tab" ? "on" : ""}">Our bill${bill.subtotal ? " · " + kes(bill.balance) : ""}</button>
    </div>
    ${state.view === "menu" ? `<div class="chips cats">${data.menu.map((c) =>
      `<button class="chip ${c.id === state.cat ? "on" : ""}" data-cat="${c.id}">${esc(c.name)}</button>`).join("")}</div>` : ""}
  </div></header>
  <main class="wrap">${state.view === "menu" ? menuHtml() : tabHtml()}</main>
  <div class="dock"><div class="inner">
    ${cartCount() ? `<button class="btn primary lg block cartbar" id="openCart">
       <span>View order · ${cartCount()} item${cartCount() > 1 ? "s" : ""}</span><span class="num" style="margin-left:auto">${kes(cartTotal())}</span></button>` : ""}
    <div class="two">
      <button class="btn lg" id="callWaiter" ${waiterOpen ? "disabled" : ""}>${waiterOpen ? "Waiter called ✓" : "🔔 Call waiter"}</button>
      <button class="btn lg ${bill.balance > 0 && !cartCount() ? "primary" : ""}" id="payBtn" ${bill.balance > 0 ? "" : "disabled"}>
        ${bill.balance > 0 ? "Pay " + kes(bill.balance) : bill.subtotal ? "Fully paid ✓" : "Pay bill"}</button>
    </div>
  </div></div>`;
  bind();
}

function menuHtml() {
  return state.data.menu.map((c) => `
    <h3 class="cat-title" id="cat-${c.id}">${esc(c.name)}</h3>
    <div class="card">${c.items.map((i) => {
      const q = state.cart.get(i.id) || 0;
      const tags = (i.tags || "").split(",").filter(Boolean).map((t) =>
        `<span class="tag">${{ veg: "VEG", spicy: "🌶 SPICY", chef: "★ CHEF'S PICK" }[t] || esc(t.toUpperCase())}</span>`).join("");
      return `<div class="item ${i.available ? "" : "out"}">
        <div class="info">
          <div class="name">${esc(i.name)}${tags}</div>
          ${i.description ? `<div class="desc">${esc(i.description)}</div>` : ""}
          <div class="price num">${i.available ? kes(i.price) : "Sold out"}</div>
        </div>
        ${!i.available ? "" : q
          ? `<div class="stepper"><button data-dec="${i.id}" aria-label="Remove one">−</button><span>${q}</span><button data-inc="${i.id}" aria-label="Add one">+</button></div>`
          : `<button class="add" data-inc="${i.id}" aria-label="Add ${esc(i.name)}">+</button>`}
      </div>`;
    }).join("")}</div>`).join("");
}

function tabHtml() {
  const b = state.bill;
  if (!b.orders.length && !b.payments.length) {
    return `<div class="empty"><p>Nothing ordered on this table yet.</p>
      <button class="btn" data-view="menu">Browse the menu</button></div>`;
  }
  const billRequested = state.requests.some((r) => r.kind === "bill");
  return `
  <div class="card" style="padding:16px;margin-top:16px">
    <div class="muted small">Balance due</div>
    <div class="balance num">${kes(b.balance)}</div>
    ${b.pending ? `<div class="banner warn small" style="margin-top:8px">A payment of ${kes(b.pending)} is in progress…</div>` : ""}
    ${b.balance === 0 && b.subtotal > 0 ? `<div class="banner ok" style="margin-top:8px">Paid in full. Thank you!</div>` : ""}
    <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">
      ${b.lines.map((l) => `<div class="bill-line"><span>${l.qty} × ${esc(l.name)}</span><span class="num">${kes(l.total)}</span></div>`).join("")}
      <div class="total-row" style="border-top:1px solid var(--line);margin-top:6px"><span>Total</span><span class="num">${kes(b.subtotal)}</span></div>
      ${b.paid ? `<div class="bill-line muted"><span>Paid so far</span><span class="num">− ${kes(b.paid)}</span></div>` : ""}
    </div>
    <div class="row" style="margin-top:12px">
      <a class="btn sm ghost" href="/r/${state.receiptToken}" target="_blank">View receipt</a>
      ${b.balance > 0 ? `<button class="btn sm ghost" id="askBill" ${billRequested ? "disabled" : ""} style="margin-left:auto">
        ${billRequested ? "Bill requested ✓" : "Ask for bill at table"}</button>` : ""}
    </div>
  </div>

  ${b.payments.filter((p) => p.status !== "failed").length ? `<h3 class="cat-title">Payments</h3><div class="card" style="padding:4px 14px">
    ${b.payments.filter((p) => p.status !== "failed").map((p) => `<div class="bill-line">
      <span>${esc(p.payer_label || (p.method === "mpesa" ? "M-Pesa" : p.method))}${p.phone_masked ? ` <span class="muted small">${p.phone_masked}</span>` : ""}</span>
      <span><span class="pill ${p.status}">${p.status}</span> <span class="num">${kes(p.amount)}</span></span></div>`).join("")}
  </div>` : ""}

  <h3 class="cat-title">Orders</h3>
  ${b.orders.map((o) => `<div class="card order-card">
    <div class="row between"><strong>${o.guest_name ? esc(o.guest_name) : "Order #" + o.id}</strong>
      <span class="row"><span class="muted small">${time(o.created_at)}</span><span class="pill ${o.status}">${o.status}</span></span></div>
    <div class="small" style="margin-top:6px">${o.items.map((i) => `${i.qty} × ${esc(i.name)}`).join(" · ")}</div>
    ${o.note ? `<div class="small muted" style="margin-top:4px">Note: ${esc(o.note)}</div>` : ""}
  </div>`).join("")}`;
}

function bind() {
  document.querySelectorAll("[data-view]").forEach((b) => (b.onclick = () => { state.view = b.dataset.view; render(); scrollTo(0, 0); }));
  document.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => {
    state.cat = Number(b.dataset.cat);
    document.getElementById("cat-" + b.dataset.cat)?.scrollIntoView({ behavior: "smooth" });
    document.querySelectorAll("[data-cat]").forEach((x) => x.classList.toggle("on", x === b));
  }));
  document.querySelectorAll("[data-inc]").forEach((b) => (b.onclick = () => { const id = Number(b.dataset.inc); state.cart.set(id, (state.cart.get(id) || 0) + 1); render(); }));
  document.querySelectorAll("[data-dec]").forEach((b) => (b.onclick = () => {
    const id = Number(b.dataset.dec); const q = (state.cart.get(id) || 0) - 1;
    q > 0 ? state.cart.set(id, q) : state.cart.delete(id); render();
  }));
  document.getElementById("openCart")?.addEventListener("click", openCart);
  document.getElementById("callWaiter")?.addEventListener("click", () => request("waiter"));
  document.getElementById("askBill")?.addEventListener("click", () => request("bill"));
  document.getElementById("payBtn")?.addEventListener("click", openPay);
}

async function request(kind) {
  try {
    await api(`/api/t/${code}/requests`, { method: "POST", body: { kind } });
    state.requests = await api(`/api/t/${code}/requests`);
    toast(kind === "waiter" ? "Waiter called. Someone will be with you shortly." : "Bill requested.");
    render();
  } catch (e) { toast(e.message); }
}

// ---------- cart ----------
function openCart() {
  const lines = [...state.cart].map(([id, q]) => ({ item: itemById(id), q }));
  const sh = sheet(`
    <div class="row between"><h2>Your order</h2><span class="muted">Table ${esc(state.data.table.label)}</span></div>
    <div style="margin-top:10px">${lines.map(({ item, q }) => `
      <div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div><div style="font-weight:700">${esc(item.name)}</div><div class="muted small num">${kes(item.price)} each</div></div>
        <div class="stepper"><button data-cdec="${item.id}">−</button><span>${q}</span><button data-cinc="${item.id}">+</button></div>
      </div>`).join("")}</div>
    <label class="lbl" for="gname">Your name (so we know whose order it is)</label>
    <input class="field" id="gname" maxlength="40" placeholder="Optional" value="${esc(localStorage.getItem(LS.name) || "")}" />
    <label class="lbl" for="gnote">Notes for the kitchen</label>
    <input class="field" id="gnote" maxlength="200" placeholder="e.g. no onions, meat well done" />
    <button class="btn primary lg block" id="placeOrder" style="margin-top:16px">Send order · ${kes(cartTotal())}</button>
    <p class="muted small" style="text-align:center;margin:10px 0 0">You'll pay at the end. Your order goes straight to the kitchen.</p>`);
  sh.querySelectorAll("[data-cinc],[data-cdec]").forEach((b) => (b.onclick = () => {
    const id = Number(b.dataset.cinc || b.dataset.cdec);
    const q = (state.cart.get(id) || 0) + (b.dataset.cinc ? 1 : -1);
    q > 0 ? state.cart.set(id, q) : state.cart.delete(id);
    render();
    cartCount() ? openCart() : closeSheet();
  }));
  sh.querySelector("#placeOrder").onclick = async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true; btn.textContent = "Sending…";
    const guestName = sh.querySelector("#gname").value.trim();
    if (guestName) localStorage.setItem(LS.name, guestName);
    try {
      await api(`/api/t/${code}/orders`, { method: "POST", body: {
        guestName, note: sh.querySelector("#gnote").value, items: [...state.cart].map(([id, qty]) => ({ id, qty })),
      }});
      state.cart.clear();
      closeSheet();
      state.view = "tab";
      render();
      toast("Order sent to the kitchen ✓");
    } catch (e) {
      btn.disabled = false; btn.textContent = "Try again";
      toast(e.message);
      if (e.status === 409) { const d = await api(`/api/t/${code}`); state.data.menu = d.menu; render(); }
    }
  };
}

// ---------- pay ----------
function openPay() {
  const b = state.bill;
  const available = Math.max(0, b.balance - b.pending);
  if (!available) return toast(b.pending ? "A payment is already in progress" : "Nothing to pay");
  const p = { mode: "full", people: 2, custom: "", tipPct: 0, tipCustom: "" };

  const amount = () => {
    if (p.mode === "full") return available;
    if (p.mode === "split") return Math.min(available, Math.ceil(b.balance / p.people));
    return Math.min(available, Math.max(0, Math.floor(Number(p.custom) || 0)));
  };
  const tip = () => (p.tipPct === -1 ? Math.max(0, Math.floor(Number(p.tipCustom) || 0)) : Math.round((amount() * p.tipPct) / 100));

  const draw = () => {
    const sh = sheet(`
      <div class="row between"><h2>Pay with M-Pesa</h2><span class="muted num">Due ${kes(b.balance)}</span></div>
      <div class="seg" style="margin-top:14px">
        <button data-mode="full" class="${p.mode === "full" ? "on" : ""}">Whole bill</button>
        <button data-mode="split" class="${p.mode === "split" ? "on" : ""}">Split equally</button>
        <button data-mode="custom" class="${p.mode === "custom" ? "on" : ""}">My share</button>
      </div>
      ${p.mode === "split" ? `<div class="row between" style="margin-top:14px"><span>Splitting between</span>
        <div class="stepper"><button id="pDec">−</button><span>${p.people}</span><button id="pInc">+</button></div></div>` : ""}
      ${p.mode === "custom" ? `<label class="lbl" for="custom">Amount you're paying</label>
        <input class="field num" id="custom" inputmode="numeric" placeholder="e.g. 1500" value="${esc(p.custom)}" />` : ""}
      <label class="lbl">Add a tip for the team?</label>
      <div class="tipchips">${[0, 5, 10].map((t) => `<button class="chip ${p.tipPct === t ? "on" : ""}" data-tip="${t}">${t ? t + "%" : "No tip"}</button>`).join("")}
        <button class="chip ${p.tipPct === -1 ? "on" : ""}" data-tip="-1">Other</button></div>
      ${p.tipPct === -1 ? `<input class="field num" id="tipc" inputmode="numeric" placeholder="Tip amount" value="${esc(p.tipCustom)}" style="margin-top:8px"/>` : ""}
      <label class="lbl" for="phone">M-Pesa number</label>
      <input class="field num" id="phone" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" value="${esc(localStorage.getItem(LS.phone) || "")}" />
      <div class="paybox">
        <div class="bill-line"><span>Towards bill</span><span class="num">${kes(amount())}</span></div>
        ${tip() ? `<div class="bill-line"><span>Tip</span><span class="num">${kes(tip())}</span></div>` : ""}
        <div class="total-row" style="border-top:1px solid var(--line)"><span>You pay</span><span class="num">${kes(amount() + tip())}</span></div>
      </div>
      <button class="btn primary lg block" id="go" style="margin-top:14px" ${amount() < 1 ? "disabled" : ""}>Send M-Pesa prompt</button>
      <p class="muted small" style="text-align:center;margin:10px 0 0">You'll get a prompt on your phone. Enter your M-Pesa PIN to finish.
        ${state.data.mockPayments ? "<br><strong>Demo mode:</strong> no real money moves." : ""}</p>`);
    sh.querySelectorAll("[data-mode]").forEach((x) => (x.onclick = () => { p.mode = x.dataset.mode; draw(); }));
    sh.querySelectorAll("[data-tip]").forEach((x) => (x.onclick = () => { p.tipPct = Number(x.dataset.tip); draw(); }));
    sh.querySelector("#pDec")?.addEventListener("click", () => { p.people = Math.max(2, p.people - 1); draw(); });
    sh.querySelector("#pInc")?.addEventListener("click", () => { p.people = Math.min(20, p.people + 1); draw(); });
    const live = (sel, key) => sh.querySelector(sel)?.addEventListener("input", (e) => {
      p[key] = e.target.value.replace(/\D/g, "");
      // update totals without losing focus
      const box = sh.querySelector(".paybox");
      box.innerHTML = `<div class="bill-line"><span>Towards bill</span><span class="num">${kes(amount())}</span></div>
        ${tip() ? `<div class="bill-line"><span>Tip</span><span class="num">${kes(tip())}</span></div>` : ""}
        <div class="total-row" style="border-top:1px solid var(--line)"><span>You pay</span><span class="num">${kes(amount() + tip())}</span></div>`;
      sh.querySelector("#go").disabled = amount() < 1;
    });
    live("#custom", "custom");
    live("#tipc", "tipCustom");
    sh.querySelector("#go").onclick = () => submit(sh);
  };

  const submit = async (sh) => {
    const phone = sh.querySelector("#phone").value.trim();
    const btn = sh.querySelector("#go");
    btn.disabled = true; btn.textContent = "Sending prompt…";
    try {
      const r = await api(`/api/t/${code}/pay`, { method: "POST", body: {
        phone, amount: amount(), tip: tip(), payerLabel: localStorage.getItem(LS.name) || "",
      }});
      localStorage.setItem(LS.phone, phone);
      waiting(r.paymentId, amount() + tip());
    } catch (e) {
      btn.disabled = false; btn.textContent = "Send M-Pesa prompt";
      toast(e.message, 4000);
    }
  };
  draw();
}

function waiting(paymentId, total) {
  sheet(`<div style="text-align:center;padding:16px 0 8px">
    <div class="spinner"></div>
    <h2 style="margin-top:18px">Check your phone</h2>
    <p class="muted">Enter your M-Pesa PIN to pay <strong class="num">${kes(total)}</strong>.<br>This screen updates on its own.</p>
  </div>`);
  let done = false;
  const finish = (p) => {
    if (done) return; done = true;
    clearInterval(poll);
    window.removeEventListener("tp-bill", onBill);
    if (p.status === "paid") {
      sheet(`<div style="text-align:center;padding:10px 0">
        <div class="bigtick">✓</div><h2>Payment received</h2>
        <p class="muted">${kes(p.amount + p.tip)} · M-Pesa ref <strong>${esc(p.provider_ref || "")}</strong></p>
        <p>${state.bill.balance > 0 ? `Remaining on the bill: <strong class="num">${kes(state.bill.balance)}</strong>` : "The bill is fully paid. Thank you!"}</p>
        <a class="btn primary lg block" href="/r/${state.receiptToken}">View receipt</a>
        <button class="btn ghost block" style="margin-top:8px" onclick="TP.closeSheet()">Back to menu</button></div>`);
    } else {
      sheet(`<div style="text-align:center;padding:10px 0"><h2>Payment not completed</h2>
        <p class="muted">${esc(p.failure_reason || "The request was cancelled or timed out.")}</p>
        <button class="btn primary lg block" id="retry">Try again</button></div>`).querySelector("#retry").onclick = openPay;
    }
  };
  const check = async () => {
    try { const p = await api(`/api/t/${code}/payments/${paymentId}`); if (p.status !== "pending") finish(p); } catch {}
  };
  const onBill = (e) => { if (e.detail.reason.startsWith("payment_")) check(); };
  window.addEventListener("tp-bill", onBill);
  const poll = setInterval(check, 3000);
}

load();
