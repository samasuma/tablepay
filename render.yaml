# One-click deploy on Render (render.com → New → Blueprint → pick this repo)
services:
  - type: web
    name: tablepay
    runtime: node
    plan: starter            # paid plan keeps the disk; "free" works for a demo but data resets on redeploy
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DB_PATH
        value: /var/data/tablepay.db
      - key: APP_SECRET
        generateValue: true
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false          # set to https://<your-service>.onrender.com or your domain
      - key: PESAPAL_ENV
        value: sandbox       # live in production
      - key: PESAPAL_CONSUMER_KEY
        sync: false          # optional fallback; venues can save their own keys in Admin > Settings
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
